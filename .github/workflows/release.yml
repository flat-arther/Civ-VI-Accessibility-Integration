name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to simulate or release, for example v1.1.0"
        required: true
        type: string
      publish_release:
        description: "Commit changes, create the tag, and publish the GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  RELEASE_BRANCH: main
  CHANGELOG_FILE: changelog.md
  MOD_SOURCE: src
  MOD_FOLDER_NAME: CivVi-Accessibility-Integration
  MODINFO_FILE: src/CivViAccess.modinfo
  LUA_VERSION_FILE: src/version_CAI.lua
  INTEGRATION_SOURCE: extern/civ6-accessibility-lua-integration
  PACKAGE_PREFIX: Civ-VI-Accessibility-Integration
  INSTALLER_PROJECT: installer/CivVIAccessInstaller.csproj
  INSTALLER_FILE_NAME: CivVIAccessInstaller.exe

jobs:
  release:
    name: Prepare, build, and publish
    runs-on: windows-latest

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          submodules: recursive
          fetch-depth: 0

      - name: Validate repository
        shell: pwsh
        run: |
          $requiredPaths = @(
              $env:CHANGELOG_FILE,
              $env:MOD_SOURCE,
              $env:MODINFO_FILE,
              $env:LUA_VERSION_FILE,
              $env:INTEGRATION_SOURCE,
              "$env:INTEGRATION_SOURCE/CMakeLists.txt",
              "$env:INTEGRATION_SOURCE/CMakePresets.json",
              $env:INSTALLER_PROJECT
          )

          foreach ($path in $requiredPaths) {
              if (-not (Test-Path $path)) {
                  throw "Required path does not exist: $path"
              }
          }

          Write-Host "Integration submodule commit:"
          git -C $env:INTEGRATION_SOURCE rev-parse HEAD

      - name: Prepare release metadata
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG.Trim()

          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
              throw "Release tag must look like v1.2.3 or v1.2.3-beta.1. Received: '$tag'"
          }

          $version = $Matches.version
          $archiveName = "$env:PACKAGE_PREFIX-$version.zip"

          git fetch origin --tags

          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) {
              throw "Tag '$tag' already exists. Use a new version."
          }

          $baseCommit = (git rev-parse HEAD).Trim()

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "archive_name=$archiveName" >> $env:GITHUB_OUTPUT
          "base_commit=$baseCommit" >> $env:GITHUB_OUTPUT

          Write-Host "Tag: $tag"
          Write-Host "Version: $version"
          Write-Host "Archive: $archiveName"
          Write-Host "Base commit: $baseCommit"

      - name: Update modinfo version
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $path = $env:MODINFO_FILE
          $contents = Get-Content $path -Raw

          $pattern = '(<Mod\s+id="9f4b5c2e-1a2b-4c3d-8e9f-123456789abc"\s+version=")[^"]+(">)'
          $matches = [regex]::Matches($contents, $pattern)

          if ($matches.Count -ne 1) {
              throw "Expected exactly one matching <Mod> version line in $path, found $($matches.Count)."
          }

          $updated = [regex]::Replace(
              $contents,
              $pattern,
              "`${1}$env:VERSION`${2}",
              1
          )

          [System.IO.File]::WriteAllText(
              (Resolve-Path $path),
              $updated,
              [System.Text.UTF8Encoding]::new($false)
          )

          [xml]$document = Get-Content $path -Raw
          $actualVersion = [string]$document.Mod.version

          if ($actualVersion -ne $env:VERSION) {
              throw "Modinfo update failed. Expected '$env:VERSION', found '$actualVersion'."
          }

          Write-Host "Updated $path to version $actualVersion."

      - name: Update Lua version
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $path = $env:LUA_VERSION_FILE
          $contents = Get-Content $path -Raw

          $pattern = '(?m)^(\s*local\s+mod_version\s*=\s*")[^"]+("\s*)$'
          $matches = [regex]::Matches($contents, $pattern)

          if ($matches.Count -ne 1) {
              throw "Expected exactly one local mod_version assignment in $path, found $($matches.Count)."
          }

          $updated = [regex]::Replace(
              $contents,
              $pattern,
              "`${1}$env:VERSION`${2}",
              1
          )

          [System.IO.File]::WriteAllText(
              (Resolve-Path $path),
              $updated,
              [System.Text.UTF8Encoding]::new($false)
          )

          $verificationContents = Get-Content $path -Raw
          $verificationMatch = [regex]::Match(
              $verificationContents,
              '(?m)^\s*local\s+mod_version\s*=\s*"([^"]+)"\s*$'
          )

          if (-not $verificationMatch.Success) {
              throw "Could not verify the Lua version in $path."
          }

          $actualVersion = $verificationMatch.Groups[1].Value

          if ($actualVersion -ne $env:VERSION) {
              throw "Lua version update failed. Expected '$env:VERSION', found '$actualVersion'."
          }

          Write-Host "Updated $path to version $actualVersion."

      - name: Rotate changelog
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $path = $env:CHANGELOG_FILE
          $contents = Get-Content $path -Raw
          $normalized = $contents -replace "`r`n", "`n"

          $versionHeadingPattern = "(?m)^## \[$([regex]::Escape($env:VERSION))\](?:\s+-\s+.*)?\s*$"
          if ([regex]::IsMatch($normalized, $versionHeadingPattern)) {
              throw "The changelog already contains a section for version $env:VERSION."
          }

          $unreleasedMatch = [regex]::Match(
              $normalized,
              '(?m)^## \[Unreleased\]\s*$'
          )

          if (-not $unreleasedMatch.Success) {
              throw "Could not find '## [Unreleased]' in $path."
          }

          $bodyStart = $unreleasedMatch.Index + $unreleasedMatch.Length
          $nextHeading = [regex]::Match(
              $normalized.Substring($bodyStart),
              '(?m)^## \[[^\]]+\](?:\s+-\s+.*)?\s*$'
          )

          if ($nextHeading.Success) {
              $bodyEnd = $bodyStart + $nextHeading.Index
              $existingHistory = $normalized.Substring($bodyEnd).TrimStart("`n")
          }
          else {
              $bodyEnd = $normalized.Length
              $existingHistory = ""
          }

          $unreleasedBody = $normalized.Substring(
              $bodyStart,
              $bodyEnd - $bodyStart
          ).Trim()

          if ([string]::IsNullOrWhiteSpace($unreleasedBody)) {
              throw "The Unreleased changelog section is empty."
          }

          $releaseDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")

          $parts = @(
              "## [Unreleased]",
              "",
              "## [$env:VERSION] - $releaseDate",
              "",
              $unreleasedBody
          )

          if (-not [string]::IsNullOrWhiteSpace($existingHistory)) {
              $parts += ""
              $parts += $existingHistory.TrimEnd()
          }

          $rotated = ($parts -join "`n").TrimEnd() + "`n"

          [System.IO.File]::WriteAllText(
              (Resolve-Path $path),
              ($rotated -replace "`n", "`r`n"),
              [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Moved Unreleased entries to version $env:VERSION dated $releaseDate."

      - name: Commit release metadata locally
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- $env:MODINFO_FILE $env:LUA_VERSION_FILE $env:CHANGELOG_FILE

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
              throw "The modinfo, Lua version file, and changelog did not change."
          }

          git commit -m "Prepare release $env:VERSION"
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to commit release metadata."
          }

          Write-Host "Created local release commit:"
          git log -1 --oneline

      - name: Configure integration DLL
        working-directory: ${{ env.INTEGRATION_SOURCE }}
        shell: pwsh
        run: cmake --preset windows

      - name: Build integration DLL
        working-directory: ${{ env.INTEGRATION_SOURCE }}
        shell: pwsh
        run: cmake --build --preset release

      - name: Locate build output
        id: dll_output
        shell: pwsh
        run: |
          $expectedFiles = @(
              "LightFX.dll",
              "nvdaControllerClient64.dll",
              "SAAPI64.dll"
          )

          $possibleDirectories = @(
              "$env:INTEGRATION_SOURCE/build/Release",
              "$env:INTEGRATION_SOURCE/build/release",
              "$env:INTEGRATION_SOURCE/build"
          )

          $outputDirectory = $null

          foreach ($directory in $possibleDirectories) {
              if (-not (Test-Path $directory)) {
                  continue
              }

              $allFound = $true

              foreach ($file in $expectedFiles) {
                  if (-not (Test-Path (Join-Path $directory $file))) {
                      $allFound = $false
                      break
                  }
              }

              if ($allFound) {
                  $outputDirectory = $directory
                  break
              }
          }

          if (-not $outputDirectory) {
              Write-Host "Files found beneath build directory:"

              if (Test-Path "$env:INTEGRATION_SOURCE/build") {
                  Get-ChildItem `
                      "$env:INTEGRATION_SOURCE/build" `
                      -Recurse `
                      -File |
                      Select-Object FullName
              }

              throw "Could not locate all required runtime DLLs."
          }

          "directory=$outputDirectory" >> $env:GITHUB_OUTPUT
          Write-Host "DLL output: $outputDirectory"

      - name: Create release package
        id: package
        shell: pwsh
        env:
          ARCHIVE_NAME: ${{ steps.version.outputs.archive_name }}
          DLL_OUTPUT: ${{ steps.dll_output.outputs.directory }}
        run: |
          $stagingRoot = Join-Path $env:RUNNER_TEMP "civ6-accessibility-package"
          $modDestination = Join-Path $stagingRoot $env:MOD_FOLDER_NAME
          $binaryDestination = Join-Path $stagingRoot "Base/Binaries/Win64Steam"
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE "release"
          $archivePath = Join-Path $releaseDirectory $env:ARCHIVE_NAME

          Remove-Item $stagingRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $releaseDirectory -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force $stagingRoot | Out-Null
          New-Item -ItemType Directory -Force $binaryDestination | Out-Null
          New-Item -ItemType Directory -Force $releaseDirectory | Out-Null

          Copy-Item `
              -Path $env:MOD_SOURCE `
              -Destination $modDestination `
              -Recurse `
              -Force

          Remove-Item `
              (Join-Path $modDestination "ideHelpers.lua") `
              -Force `
              -ErrorAction SilentlyContinue

          Remove-Item `
              (Join-Path $modDestination "todo.md") `
              -Force `
              -ErrorAction SilentlyContinue

          $runtimeDlls = @(
              "LightFX.dll",
              "nvdaControllerClient64.dll",
              "SAAPI64.dll"
          )

          foreach ($dll in $runtimeDlls) {
              $sourcePath = Join-Path $env:DLL_OUTPUT $dll

              if (-not (Test-Path $sourcePath)) {
                  throw "Required DLL does not exist: $sourcePath"
              }

              Copy-Item `
                  -Path $sourcePath `
                  -Destination $binaryDestination `
                  -Force
          }

          Compress-Archive `
              -Path "$stagingRoot/*" `
              -DestinationPath $archivePath `
              -CompressionLevel Optimal

          if (-not (Test-Path $archivePath)) {
              throw "Release archive was not created."
          }

          "archive_path=$archivePath" >> $env:GITHUB_OUTPUT

          Write-Host "Package contents:"
          Get-ChildItem $stagingRoot -Recurse |
              Select-Object FullName

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish installer
        id: installer
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP "installer-publish"
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE "release"
          $installerPath = Join-Path $releaseDirectory $env:INSTALLER_FILE_NAME

          Remove-Item $publishDirectory -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $publishDirectory | Out-Null
          New-Item -ItemType Directory -Force $releaseDirectory | Out-Null

          dotnet publish $env:INSTALLER_PROJECT `
              --configuration Release `
              --runtime win-x64 `
              --self-contained true `
              --output $publishDirectory `
              -p:PublishSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true

          if ($LASTEXITCODE -ne 0) {
              throw "Installer publish failed with exit code $LASTEXITCODE."
          }

          $publishedExe = Join-Path $publishDirectory $env:INSTALLER_FILE_NAME

          if (-not (Test-Path $publishedExe)) {
              Write-Host "Published files:"
              Get-ChildItem $publishDirectory -Recurse -File |
                  Select-Object FullName

              throw "Published installer was not found: $publishedExe"
          }

          Copy-Item $publishedExe $installerPath -Force
          "exe_path=$installerPath" >> $env:GITHUB_OUTPUT

          $file = Get-Item $installerPath
          Write-Host "Installer: $($file.FullName)"
          Write-Host "Size: $([Math]::Round($file.Length / 1MB, 2)) MB"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Civ-VI-Accessibility-Integration-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.installer.outputs.exe_path }}
          if-no-files-found: error

      - name: Summarize test build
        if: ${{ !inputs.publish_release }}
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          Write-Host "Test build completed for version $env:VERSION."
          Write-Host "No commit, tag, or GitHub Release was created."
          Write-Host "Download the workflow artifact to inspect the ZIP and installer."

      - name: Publish release commit and tag
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BASE_COMMIT: ${{ steps.version.outputs.base_commit }}
        run: |
          git fetch origin $env:RELEASE_BRANCH --tags

          $remoteCommit = (git rev-parse "origin/$env:RELEASE_BRANCH").Trim()

          if ($remoteCommit -ne $env:BASE_COMMIT) {
              throw @"
          The remote $env:RELEASE_BRANCH branch changed while the release was building.
          Expected: $env:BASE_COMMIT
          Current:  $remoteCommit
          No commit or tag was pushed. Run the workflow again.
          "@
          }

          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -eq 0) {
              throw "Tag '$env:RELEASE_TAG' was created while the release was building."
          }

          git push origin "HEAD:$env:RELEASE_BRANCH"
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to push the release commit to $env:RELEASE_BRANCH."
          }

          git tag -a $env:RELEASE_TAG -m "Release $env:VERSION"
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to create tag $env:RELEASE_TAG."
          }

          git push origin $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to push tag $env:RELEASE_TAG."
          }

      - name: Create GitHub release
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE_PATH: ${{ steps.package.outputs.archive_path }}
          INSTALLER_PATH: ${{ steps.installer.outputs.exe_path }}
        run: |
          $arguments = @(
              "release",
              "create",
              $env:RELEASE_TAG,
              $env:ARCHIVE_PATH,
              $env:INSTALLER_PATH,
              "--verify-tag",
              "--title",
              "Civ VI Accessibility Integration $env:VERSION",
              "--generate-notes"
          )

          if ($env:VERSION.Contains("-")) {
              $arguments += "--prerelease"
          }

          & gh @arguments

          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release creation failed."
          }
